# PhysFTM paper configuration.
run:
  results_dir: null
  results_prefix: ocean_spatial_infer
  device: cuda:0
artifact:
  ftm_manifest_path: ${oc.env:PHYSFTM_OCEAN_FTM_MANIFEST}
data:
  data_manifest_path: ${oc.env:PHYSFTM_OCEAN_BASE_MANIFEST}
  split: test
  batch_size: 32
  auto_crop_time_to_core: none
core:
  lambda_core_ridge: 0.01
  beta_core_tv: 0.01
  cg_max_iter: 30
  cg_tol: 0.0001
  prior_core_mode: mean
pde:
  dataset_type: none
  point_sample_ratio: 0.25
  point_max_points: 0
  query_chunk_size: 8192
  domain:
    Lx: 5.25
    Ly: 5.25
    Lz: 540.5949
    dt: null
    query_dt: null
eval:
  skip_ssim: false
  n_plot_samples: 1
  plot_time_indices: 0,45,89
  save_dtype: float32
