# PhysFTM paper configuration.
run:
  data_name: heat3d
  seed: 123
data:
  data_manifest_path: ${oc.env:PHYSFTM_HEAT3D_BASE_MANIFEST}
  data_path: null
  metadata_path: null
  dataset_type: heat3d
  batch_size: 8
  num_workers: 0
model:
  R:
  - 16
  - 16
  - 16
  core_parameterization: per_time
  norm_mode: channelwise_zscore
optimization:
  learning_rate: 0.0002
  max_epochs: 500
  print_every: 30
  eval_every: 30
  profile_every: 0
core:
  core_update_mode: cg
  core_learning_rate: 0.0
  lambda_core_ridge: 0.01
  beta_core_tv: 0.01
  als_core_cg_iter: 5
  als_core_cg_tol: 0.001
  als_core_steps: 1
basis:
  als_basis_steps: 1
  basis_update_mode: adam
rkhs:
  lambda_rkhs: 0.0001
  lambda_time: 1.0e-05
  coef_scale: 0.01
  kernel_type: matern32
  lengthscale_u: null
  lengthscale_v: null
  lengthscale_w: null
pde:
  lambda_pde_point: 1e-4
  point_sample_ratio: 0.25
  point_max_points: 0
  query_chunk_size: 8192
  point_sample_mode: unobserved_grid
  start_step: 0
  monitor_always: true
  monitor_point: true
  domain:
    Lx: 1.0
    Ly: 1.0
    Lz: 1.0
    dt: null
    query_dt: null
  heat3d:
    alpha: 0.01
    fd_dx: 0.0015
    fd_dy: 0.0015
    fd_dz: 0.0015
    fd_space_order: 2
    fd_time_order: 2
plots:
  reconstruction_on_log: true
  pde_residual_on_log: true
  pde_residual_sample_index: 0
  pde_residual_sample_indices:
  - 0
  - 1
  - 2
